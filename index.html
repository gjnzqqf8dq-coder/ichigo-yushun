<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="苺優駿 ICHIGO YUSHUN 2027 — 東京優駿と同じ日に、いちごの日本一を決める。">
<title>苺優駿 ICHIGO YUSHUN 2027</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="苺優駿">
<link rel="stylesheet" href="ui.css?v=2">
</head>
<body>

<div id="shell">
  <div id="grid"></div>
  <div id="fieldwrap"><canvas id="field"></canvas></div>

  <header id="head">
    <button id="back" aria-label="戻る"><i></i></button>
    <div class="mark">
      <svg viewBox="0 0 40 22"><path d="M2 20 L8 7 L14 14 L20 2 L26 14 L32 7 L38 20 Z"/></svg>
      <b>ICHIGO YUSHUN</b>
    </div>
    <div class="rt" id="rt">—</div>
  </header>

  <main id="views">
    <section class="view" id="v-intro"></section>
    <section class="view" id="v-paddock"></section>
    <section class="view" id="v-owner"></section>
    <section class="view" id="v-race"></section>
    <section class="view" id="v-result"></section>
    <section class="view" id="v-stable"></section>
    <section class="view" id="v-crossing"></section>
    <section class="view" id="v-about"></section>
  </main>

  <nav id="tabs">
    <button class="t1" data-go="paddock"><i></i><span>PADDOCK</span></button>
    <button class="t2" data-go="race"><i></i><span>RACE</span></button>
    <button class="t3" data-go="stable"><i></i><span>STABLE</span></button>
    <button class="t4" data-go="about"><i></i><span>ABOUT</span></button>
  </nav>

  <div id="toast"></div>
</div>

<script src="data.js?v=2"></script>
<script src="field.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
