const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const go=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$(id).scrollTop=0};

function row(h,o={}){return `<div class="row${o.sel?' sel':''}" data-id="${h.id}">
 ${o.sel?'<span class="mk">◎</span>':''}
 <div class="waku num" style="background:${WK[h.w]};color:${FG[h.w]}">${h.w}</div>
 <div><div class="ln">${h.ln}</div><div class="meta">3歳・${h.from}・${h.shape}・${h.wt}g</div>
 ${o.sire?`<div class="sire">父 ${h.sire}</div>`:''}${o.mine?'<div class="mine">あなたが出資した系統の子</div>':''}</div>
 <div class="rt"><b class="num">${h.ratio}</b><small>糖酸比</small></div></div>`}
const bind=(sel,arr,fn)=>document.querySelectorAll(sel+' .row').forEach(r=>r.onclick=()=>fn(arr.find(x=>x.id===r.dataset.id)));

function sheet(h){
 $('sheetBody').innerHTML=`<div class="sh-ln">${h.ln}</div>
 <div class="sh-sub">枠${h.w}・3歳・${h.from}・未商品化系統・実生個体番号 ${h.seed}</div>
 <div class="spec">
  <div><dt>糖度</dt><dd class="num">${h.brix}<i>Brix</i></dd></div>
  <div><dt>酸度</dt><dd class="num">${h.acid}<i>%</i></dd></div>
  <div><dt>糖酸比</dt><dd class="num">${h.ratio}</dd></div>
  <div><dt>果皮硬度</dt><dd class="num">${h.firm}<i>g/φ2mm</i></dd></div>
  <div><dt>一果重</dt><dd class="num">${h.wt}<i>g</i></dd></div>
  <div><dt>成熟日数</dt><dd class="num">${h.days}<i>日</i></dd></div>
  <div><dt>果実の形</dt><dd>${h.shape}</dd></div>
  <div><dt>近交係数</dt><dd class="num" style="color:${h.ci<0.15?'var(--brand)':h.ci>=0.28?'#E8C31E':'var(--ink)'}">${h.ci.toFixed(3)}</dd></div>
 </div>
 <div class="ped"><div class="lbl">3代血統表</div><table><tbody>
  <tr><td class="g1" rowspan="4">${h.sire}</td><td class="g2" rowspan="2">${h.ss}</td><td class="g3">${h.sss}</td></tr>
  <tr><td class="g3">${h.ssd}</td></tr><tr><td class="g2" rowspan="2">${h.sd}</td><td class="g3">${h.sds}</td></tr>
  <tr><td class="g3">${h.sdd}</td></tr>
  <tr><td class="g1" rowspan="4">${h.dam}</td><td class="g2" rowspan="2">${h.ds}</td><td class="g3">${h.dss}</td></tr>
  <tr><td class="g3">${h.dsd}</td></tr><tr><td class="g2" rowspan="2">${h.dd}</td><td class="g3">${h.dds}</td></tr>
  <tr><td class="g3">${h.ddd}</td></tr></tbody></table>
  <div class="cap">上半分が父系、下半分が母系。母の父は、JRAの表記では<b>ブルードメアサイヤー</b>という。${h.bms}<br>
   福羽・Haward17・ダナーは、日本のイチゴ品種のほぼ全部にさかのぼれる3つの始祖である。</div></div>
 <div class="lbl" style="margin-top:22px">ここまでの選抜</div>
 <div class="steps">${h.sel.map(s=>`<div>${s}</div>`).join('')}</div>
 <div class="tale">${h.tale}</div>`;
 $('dim').classList.add('on');$('sheet').classList.add('on')}
$('dim').onclick=()=>{$('dim').classList.remove('on');$('sheet').classList.remove('on')};

$('d0').textContent=`第1回 ・ ${Y1}年5月30日（日）`;
$('s0').onclick=()=>go('s1');

$('n1').innerHTML=`レース前に出走馬を歩かせ、その日の状態を自分の目で見る場所を<b>パドック</b>という。JRAの正式名称は<b>下見所</b>（したみじょ）。<br><br>
 ここに並ぶ6つは、まだ<b>商品になっていない系統</b>。名前はなく、系統番号で呼ばれている。
 <span class="r">市販品は1つも出ていない。</span>順位がついて既存商品の売上が落ちることが、この競走では起きない。<br><br>
 触ると、3代血統表と、ここまでの選抜が開く。`;
$('list1').innerHTML=H.map(h=>row(h)).join('');bind('#list1',H,sheet);
$('f1').innerHTML=`苺優駿＝日本ダービーの正式名称「東京優駿」から。優駿とは、優れた馬のこと。<br>
 系統番号は、実生個体番号 → 系統番号 → 出願名称 → 商標 の順に名前が変わる。商標が付くのは、登録されたあと。`;
$('go2').onclick=()=>{paint2();go('s2')};

$('n2').innerHTML=`競馬には<b>一口馬主</b>という仕組みがある。1頭を大勢で分けて持ち、近況を受け取り、勝てば口取り式に立てる。<br><br>
 苺優駿でも、6系統から<b>1つだけ</b>を選んで出資する。<span class="r">選べるのは1つ。あとから変えられない。</span>
 ダービーに出られるのは3歳の一年だけで、どの馬も一生に一度しか走らないからである。`;
function paint2(){$('list2').innerHTML=H.map(h=>row(h,{sel:pick===h.id})).join('');
 document.querySelectorAll('#list2 .row').forEach(r=>r.onclick=()=>{pick=r.dataset.id;paint2();
  const b=$('go3');b.disabled=false;b.textContent=`${H.find(h=>h.id===pick).ln} に出資する`})}
$('go3').onclick=()=>{go('s3');judge()};

async function judge(){
 const ph=$('phase');
 $('list3').innerHTML=H.map(h=>`<div class="jd" data-id="${h.id}">
  <div class="waku num" style="background:${WK[h.w]};color:${FG[h.w]}">${h.w}</div>
  <div class="ln">${h.ln}</div><div class="jv num" style="color:var(--dim)">－－</div>
  <div class="jw num" style="color:var(--dim)">－－</div></div>`).join('');
 const rows=[...document.querySelectorAll('.jd')];
 ph.textContent='系統番号を伏せて審査'; await sleep(1500);
 for(const h of [...H].sort((a,b)=>(a.exp+a.vote)-(b.exp+b.vote))){
  const el=rows.find(r=>r.dataset.id===h.id);el.classList.add('lit');
  const jv=el.querySelector('.jv'),jw=el.querySelector('.jw');
  jv.style.color='var(--ink)';jw.style.color='var(--sub)';
  let v=0;const t=setInterval(()=>{v+=Math.random()*9;jv.textContent=Math.min(v,h.exp).toFixed(1)},40);
  await sleep(680);clearInterval(t);jv.textContent=h.exp.toFixed(1);jw.textContent=h.vote+'%';
  if(h.id===WIN){jv.style.color='var(--brand)';jw.style.color='var(--brand)'}
  await sleep(240)}
 ph.textContent='専門家の点 ＋ オーナーズクラブの票';await sleep(1300);
 result();go('s4')}

function result(){
 const w=H.find(h=>h.id===WIN),me=H.find(h=>h.id===pick),hit=pick===WIN;
 $('born').textContent='日本初の夏いちご、誕生';
 $('newname').textContent=w.name;
 $('fromln').textContent=`${w.ln} に商品名が与えられた`;
 const v=$('vd');v.textContent=hit?'的中 ／ 口取り式に立てます':'不的中';v.className='vd'+(hit?' hit':'');
 $('bars').innerHTML=H.map(h=>`<i style="background:${WK[h.w]}" class="${h.id===WIN?'on':''}"></i>`).join('');
 $('n4').innerHTML=(hit?`あなたが出資した <b class="r">${me.ln}</b> が勝った。${me.tale}`
  :`あなたが出資したのは <b>${me.ln}</b>。${me.tale}<br><br>勝ったのは ${w.ln}。${w.tale}`)
  +`<br><br>5月末まで糖度と硬度を保てる系統が日本一になった。つまり <b class="r">夏に食べられるイチゴが生まれた</b> ということである。<br><br>
    商品化されるのはこの1系統だけ。残る5つは、翌年の交配親として畑に残る。`;
 S.y1={pick:pick,hit:hit};save()}
$('go5').onclick=()=>{next();go('s5')};

function next(){
 const w=H.find(h=>h.id===WIN);
 $('n5').innerHTML=`<b>第2回 ・ ${Y2}年5月28日（日）</b><br><br>
  優勝した <b class="r">${w.name}</b> は交配親になった。出走表の「父」の欄に、その名前が載っている。`
  +(pick===WIN?'<br><span class="r">あなたが出資した系統の子が、今年走る。</span>':'');
 $('list5').innerHTML=N2.map(h=>row(h,{sire:true,mine:pick===WIN&&h.sire===w.name})).join('');
 bind('#list5',N2,sheet);
 $('f5').innerHTML=`勝った馬が次の世代の親になる。だからダービーは毎年つづく。<br>
  ディープインパクトは2005年のダービー馬で、種牡馬として日本ダービー馬を7頭出した。<br>枠の色は1白・2黒・3赤・4青・5黄・6緑・7橙・8桃。7枠と8枠は「オレンジ」「ピンク」ではない。`}
$('go6').onclick=()=>{cross();go('s6')};

const POOL=()=>[...H.map(h=>({id:h.id,ln:h.ln,brix:h.brix,acid:h.acid,firm:h.firm,wt:h.wt,days:h.days,shape:h.shape,ci:h.ci,
  anc:[h.ss,h.sd,h.ds,h.dd,h.sss,h.ssd,h.sds,h.sdd,h.dss,h.dsd,h.dds,h.ddd]})),
 (x=>({id:'win',ln:x.name,brix:x.brix,acid:x.acid,firm:x.firm,wt:x.wt,days:x.days,shape:x.shape,ci:x.ci,
  anc:[x.ss,x.sd,x.ds,x.dd,x.sss,x.ssd,x.sds,x.sdd,x.dss,x.dsd,x.dds,x.ddd]}))(H.find(h=>h.id===WIN))];

function cross(){
 $('n6').innerHTML=`イチゴの育種には、競馬と同じ指標がある。<b>近交係数</b>。血統がどれだけ近いかを表す数で、
  <span class="r">0.3を超えると収量が落ちる</span>と報告されている。<br><br>
  日本の主要品種は、やよいひめ0.346、とちおとめ0.261、あまおう0.213。福羽・Haward17・ダナーという
  3つの始祖に、ほぼ全部がさかのぼる。<b>もう血統が近すぎる。</b><br><br>
  CULTAが2年で品種を作れる意味は、ここにある。<b>遠い親どうしを掛けられる。</b><br><br>
  親を2つ選ぶ。<span class="r">生まれるものは選べない。</span>`;
 paintOpts()}

function ciOf(A,B){ // 共通祖先の重なりから近交係数を概算
 if(!A||!B) return null;
 const set=new Set(A.anc), shared=B.anc.filter(x=>set.has(x));
 const uniq=new Set(shared).size;
 return Math.min(0.44,Math.max(0.02,+(0.030+uniq*0.058+(A.ci+B.ci)/9).toFixed(3)));
}
function paintOpts(){
 $('opts').innerHTML=POOL().map(p=>`<button data-id="${p.id}" class="${(slot==='A'?pa:pb)===p.id?'on':''}">${p.ln}</button>`).join('');
 document.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.id;
  if(slot==='A'){pa=v;slot='B'}else{pb=v;slot='A'}
  const A=POOL().find(p=>p.id===pa),B=POOL().find(p=>p.id===pb);
  $('pA').querySelector('b').textContent=A?A.ln:'選ぶ';$('pA').classList.toggle('on',slot==='A');
  $('pB').querySelector('b').textContent=B?B.ln:'選ぶ';$('pB').classList.toggle('on',slot==='B');
  const ci=ciOf(A,B);
  if(ci!=null&&pa!==pb){
   $('ciBox').style.display='flex';$('ciV').textContent=ci.toFixed(3);
   $('ciV').style.color=ci<0.15?'var(--brand)':ci>0.30?'#E8C31E':'var(--ink)';
   $('ciT').innerHTML=ci<0.15?'遠い血統どうし。良い個体が出やすい。'
    :ci>0.30?'近すぎる。0.3を超えると収量が落ちる。':'標準的な範囲。平均は0.210。';
  }else $('ciBox').style.display='none';
  $('doCross').disabled=!(pa&&pb&&pa!==pb);
  paintOpts()})}
$('pA').onclick=()=>{slot='A';paintOpts()};$('pB').onclick=()=>{slot='B';paintOpts()};

$('doCross').onclick=async()=>{
 const A=POOL().find(p=>p.id===pa),B=POOL().find(p=>p.id===pb),ci=ciOf(A,B);
 const g=ci<0.15?1:ci>0.30?-1:0;                       // 近交係数が低いほど良い個体が出やすい
 const mid=(x,y)=>(x+y)/2, jit=r=>(Math.random()*2-1)*r;
 const brix=+(mid(A.brix,B.brix)+jit(.55)+g*.42).toFixed(1);
 const acid=+(mid(A.acid,B.acid)+jit(.06)).toFixed(2);
 const firm=Math.round(Math.max(A.firm,B.firm)*.62+Math.min(A.firm,B.firm)*.38+jit(5)+g*4);
 const wt=+(mid(A.wt,B.wt)+jit(1.4)+g*.9).toFixed(1);
 const days=Math.round(mid(A.days,B.days)+jit(3));
 const shape=Math.random()<.5?A.shape:B.shape;
 const seeds=300+Math.floor(Math.random()*201);
 const no=String(Math.floor(Math.random()*89)+10);
 const ratio=+(brix/acid).toFixed(1);
 const box=$('bred');box.innerHTML=`<div class="lbl">交配</div>`;
 for(const s of [`採種 ${seeds}粒`,'実生 1万株 → 一次選抜 300','二次選抜 300 → 30','三次選抜 30 → 5','系統番号を付与']){
  box.innerHTML+=`<div class="steps"><div>${s}</div></div>`;await sleep(600)}
 box.innerHTML=`<div class="lbl">生まれた系統</div>
  <div class="sh-ln" style="margin-top:8px">CULTA i-2028-${no}</div>
  <div class="sh-sub">${A.ln} × ${B.ln}　／　近交係数 ${ci.toFixed(3)}</div>
  <div class="spec">
   <div><dt>糖度</dt><dd class="num">${brix}<i>Brix</i></dd></div>
   <div><dt>酸度</dt><dd class="num">${acid}<i>%</i></dd></div>
   <div><dt>糖酸比</dt><dd class="num" style="color:${ratio>=16?'var(--brand)':'var(--ink)'}">${ratio}</dd></div>
   <div><dt>果皮硬度</dt><dd class="num">${firm}<i>g/φ2mm</i></dd></div>
   <div><dt>一果重</dt><dd class="num">${wt}<i>g</i></dd></div>
   <div><dt>成熟日数</dt><dd class="num">${days}<i>日</i></dd></div>
   <div><dt>果実の形</dt><dd>${shape}</dd></div>
   <div><dt>近交係数</dt><dd class="num" style="color:${ci<0.15?'var(--brand)':ci>0.30?'#E8C31E':'var(--ink)'}">${ci.toFixed(3)}</dd></div>
  </div>
  <div class="tale">${ratio>=16&&firm>=75?'糖酸比と果皮硬度を両立した。5月末まで走れる可能性がある。'
   :ratio>=16?'糖酸比は高い。ただし果皮が柔らかく、遠くへは運べない。'
   :firm>=80?'硬さは十分。ただし糖酸比が伸びなかった。'
   :'親を超えなかった。1万株のうち、系統番号まで残るのは5つしかない。'}</div>
  <div class="cap">果皮硬度は硬い親に寄りやすく、糖度は両親の中間に出やすい。
   同じ組合せでも生まれるものは毎回ちがう。交配してから系統番号が付くまで、実際には4〜5年かかる。</div>`};

$('f6').innerHTML=`第1回 苺優駿 ／ CULTA　　制作：東京藝術大学 デザイン科 桑田航希<br>
 電通「アイデアの学校」2026 提出企画。品種名・系統番号は架空。<br>
 単位と数値の幅は一次資料に準拠。近交係数は稲葉・吉田（園芸学研究 2006）、
 選抜の実数は栃木県いちご研究所、果実の形は品種登録審査基準の9区分、競馬の用語はJRA公式による。`;
$('again').onclick=()=>{pick=null;pa=pb=null;slot='A';$('go3').disabled=true;$('go3').textContent='出資を確定する';
 $('bred').innerHTML='';$('doCross').disabled=true;$('ciBox').style.display='none';go('s0')};
</script>
</body>
</html>
